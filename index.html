<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c2185b">
<title>MSFK Verkoop & THT</title>
<style>
:root{--brand:#c2185b;--dark:#8e1244;--bg:#f4f6fa;--surface:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--good:#15803d;--warning:#c77800;--danger:#b91c1c;--shadow:0 12px 34px rgba(31,41,55,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.hidden{display:none!important}
.loading,.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:28px}
.login-card{width:min(450px,100%);text-align:center;border-top:7px solid var(--brand)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(14px,4vw,48px);background:linear-gradient(135deg,var(--brand),var(--dark));color:#fff}.top h1{margin:0}
.tabs{display:flex;gap:9px;overflow:auto;padding:12px clamp(12px,4vw,48px);background:#fff;border-bottom:1px solid var(--border)}
.tabs button{border:0;border-radius:999px;padding:10px 16px;background:#f1f3f5;font-weight:800;white-space:nowrap;cursor:pointer}.tabs button.active{background:var(--brand);color:#fff}
main{width:min(1180px,100%);margin:auto;padding:22px 14px 50px}.tab{display:none}.tab.active{display:block}
input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;font:inherit;background:#fff;outline:none}
label{display:block;font-weight:700;margin:14px 0 7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 150px 1fr;gap:14px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#263238;color:#fff}.light{background:#eef0f3}.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.toolbar{display:grid;grid-template-columns:1fr 220px 220px;gap:10px;background:#fff;padding:14px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:18px}.panel{margin-bottom:20px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:17px}.card{overflow:hidden;background:#fff;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--border)}
.photo{aspect-ratio:1/1;background:#eef0f3;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{width:100%;height:100%;display:grid;place-items:center;color:var(--muted)}
.badge{position:absolute;top:10px;left:10px;background:#fff;padding:6px 9px;border-radius:99px;font-size:.77rem;font-weight:800}.body{padding:15px}.cat{font-size:.78rem;color:var(--brand);font-weight:800;text-transform:uppercase}
.body h2{font-size:1.1rem;margin:5px 0}.meta{color:var(--muted);font-size:.9rem;line-height:1.45}.price{font-size:1.35rem;font-weight:900;color:var(--dark);margin-top:10px}
.preview{width:210px;height:210px;object-fit:cover;border-radius:15px;margin-top:10px}.scan-line{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}#reader{max-width:520px;margin:14px auto;background:#fff;border-radius:16px;overflow:hidden}.found-box{margin-top:10px;padding:12px;border-radius:12px;background:#ecfdf5;color:#166534;font-weight:700}.sales-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sale-items{display:grid;gap:10px;margin-top:14px}.sale-item{display:grid;grid-template-columns:1fr 100px 120px auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--border);border-radius:12px;background:#fafafa}.history-card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:12px}.history-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.total-box{font-size:1.35rem;font-weight:900;color:var(--dark);margin-top:12px}.status-paid{color:#15803d;font-weight:800}.status-open{color:#b91c1c;font-weight:800}@media(max-width:760px){.sales-grid{grid-template-columns:1fr}.sale-item{grid-template-columns:1fr 90px}.sale-item .wide{grid-column:1/-1}}.message{min-height:22px;margin-top:10px;font-weight:700}.row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px;background:#fff;border-radius:15px;border:1px solid var(--border);margin-bottom:10px}.row img{width:80px;height:80px;object-fit:cover;border-radius:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}
@media(max-width:760px){.toolbar,.grid2,.grid3{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.row{grid-template-columns:65px 1fr}.actions{grid-column:1/-1}}
@media(max-width:430px){.product-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading" class="loading">App laden…</div>
<section id="login" class="login hidden"><div class="login-card"><h1>MSFK Verkoop & THT</h1><p>Privé productcatalogus.</p><button id="loginBtn" class="btn primary">Inloggen met Google</button><div id="loginMsg" class="message"></div></div></section>
<div id="app" class="hidden">
<header class="top"><div><h1>MSFK Verkoop & THT</h1><small id="email"></small></div><button id="logoutBtn" class="btn ghost">Uitloggen</button></header>
<nav class="tabs"><button data-tab="catalog" class="active">Catalogus</button><button data-tab="add">Product toevoegen</button><button data-tab="sale">Nieuwe verkoop</button><button data-tab="customers">Klanten & historie</button></nav>
<main>
<section id="catalog" class="tab active"><div class="toolbar"><input id="search" type="search" placeholder="Zoek product…"><select id="category"><option value="all">Alle categorieën</option></select><select id="availability"><option value="available">Alleen beschikbaar</option><option value="all">Alles tonen</option><option value="soldout">Uitverkocht</option></select></div><div id="grid" class="product-grid"></div></section>
<section id="add" class="tab">
<div class="panel"><h2 id="formTitle">Nieuw product</h2><input id="editId" type="hidden">
<div class="grid2"><div><label>Productnaam</label><input id="name"></div><div><label>Prijs $</label><input id="price" type="number" min="0" step="0.01"></div></div>
<div class="grid3"><div><label>THT-datum</label><input id="expiry" type="date"></div><div><label>Aantal</label><input id="qty" type="number" min="0" value="1"></div><div><label>Categorie</label><input id="cat"></div></div>
<label>Barcode</label>
<div class="scan-line">
  <input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Scan of typ barcode">
  <button id="scanBtn" type="button" class="btn secondary">Scan met camera</button>
</div>
<div id="reader" class="hidden"></div>
<button id="stopScanBtn" type="button" class="btn light hidden" style="margin-top:8px">Stop scanner</button>
<div id="foundBox" class="found-box hidden"></div>
<label>Omschrijving</label><textarea id="notes" rows="3"></textarea>
<label>Productfoto</label><input id="photoInput" type="file" accept="image/*" capture="environment"><img id="preview" class="preview hidden">
<p><label><input id="available" type="checkbox" checked style="width:auto"> Beschikbaar</label></p>
<button id="saveBtn" class="btn primary">Opslaan</button> <button id="cancelBtn" class="btn light hidden">Annuleren</button><div id="formMsg" class="message"></div></div>
<div class="panel"><h2>Producten beheren</h2><div id="list"></div></div>
</section>

<section id="sale" class="tab">
  <div class="panel">
    <h2>Nieuwe verkoop</h2>
    <div class="sales-grid">
      <div><label>Klantnaam</label><input id="saleCustomerName" placeholder="Naam klant"></div>
      <div><label>Telefoonnummer</label><input id="saleCustomerPhone" placeholder="Telefoonnummer"></div>
    </div>
    <div class="sales-grid">
      <div><label>Betaalstatus</label><select id="salePaymentStatus"><option value="paid">Betaald</option><option value="open">Openstaand</option></select></div>
      <div><label>Opmerking</label><input id="saleNote" placeholder="Optioneel"></div>
    </div>
    <div id="saleItems" class="sale-items"></div>
    <button id="addSaleItemBtn" class="btn light" type="button" style="margin-top:12px">Productregel toevoegen</button>
    <div class="total-box">Totaal: $ <span id="saleTotal">0.00</span></div>
    <button id="saveSaleBtn" class="btn primary" type="button" style="margin-top:12px">Verkoop opslaan</button>
    <div id="saleMessage" class="message"></div>
  </div>
</section>

<section id="customers" class="tab">
  <div class="panel">
    <h2>Klanten & verkoophistorie</h2>
    <div class="toolbar" style="grid-template-columns:1fr 220px">
      <input id="customerSearch" type="search" placeholder="Zoek klant of telefoonnummer…">
      <select id="historyStatusFilter"><option value="all">Alle verkopen</option><option value="paid">Betaald</option><option value="open">Openstaand</option></select>
    </div>
    <div id="historyList"></div>
  </div>
</section>

</main></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,addDoc,deleteDoc,onSnapshot,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

const firebaseConfig={apiKey:"AIzaSyAz84bwA97vvqv7LrjvYXBI7BheRwGM_ms",authDomain:"makro-tht.firebaseapp.com",projectId:"makro-tht",storageBucket:"makro-tht.firebasestorage.app",messagingSenderId:"777366139530",appId:"1:777366139530:web:2cc8ca4c2dfffb9e07f373",measurementId:"G-K9SV5ZLM83"};
const OWNER='mh.makrostore@gmail.com',appFirebase=initializeApp(firebaseConfig),auth=getAuth(appFirebase),db=getFirestore(appFirebase),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);
let products=[],sales=[],photoData='',html5QrCode=null,scannerRunning=false;
const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const msg=(el,t,e=false)=>{el.textContent=t;el.style.color=e?'#b91c1c':'#15803d'};
async function imageData(file){const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const im=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=data});const max=700,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.68)}

function newestProductForBarcode(code){
  const matches=products.filter(p=>String(p.barcode||'').trim()===String(code||'').trim());
  if(!matches.length)return null;
  return matches.sort((a,b)=>{
    const at=a.updatedAt?.seconds||a.createdAt?.seconds||0;
    const bt=b.updatedAt?.seconds||b.createdAt?.seconds||0;
    return bt-at;
  })[0];
}
function applySavedProduct(code){
  const p=newestProductForBarcode(code);
  const box=$('foundBox');
  if(!p){
    box.classList.add('hidden');
    box.textContent='';
    return false;
  }
  $('name').value=p.name||'';
  $('price').value=p.price??'';
  $('expiry').value=p.expiryDate||'';
  $('qty').value=p.quantity??1;
  $('cat').value=p.category||'';
  $('notes').value=p.notes||'';
  $('available').checked=p.available!==false;
  photoData=p.photoData||'';
  if(photoData){
    $('preview').src=photoData;
    $('preview').classList.remove('hidden');
  }else{
    $('preview').src='';
    $('preview').classList.add('hidden');
  }
  box.textContent=`Eerder opgeslagen product gevonden: ${p.name||'product'} · prijs $ ${Number(p.price||0).toFixed(2)}${p.expiryDate?' · laatste THT '+p.expiryDate:''}`;
  box.classList.remove('hidden');
  msg($('formMsg'),'Productgegevens automatisch ingevuld.');
  return true;
}
async function stopScanner(){
  if(html5QrCode&&scannerRunning){
    try{await html5QrCode.stop();}catch{}
    try{await html5QrCode.clear();}catch{}
  }
  scannerRunning=false;
  $('reader').classList.add('hidden');
  $('stopScanBtn').classList.add('hidden');
}
async function startScanner(){
  if(!window.Html5Qrcode){
    return msg($('formMsg'),'Scanner kon niet worden geladen. Controleer internet en probeer opnieuw.',true);
  }
  await stopScanner();
  $('reader').classList.remove('hidden');
  $('stopScanBtn').classList.remove('hidden');
  html5QrCode=new Html5Qrcode('reader');
  const formats=[
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39
  ];
  try{
    await html5QrCode.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:280,height:150},formatsToSupport:formats},
      async decodedText=>{
        $('barcode').value=decodedText;
        applySavedProduct(decodedText);
        msg($('formMsg'),'Barcode gescand: '+decodedText);
        await stopScanner();
      },
      ()=>{}
    );
    scannerRunning=true;
  }catch(e){
    await stopScanner();
    msg($('formMsg'),'Camera kon niet worden geopend. Geef Chrome toestemming voor de camera.',true);
  }
}


function productOptions(selected=''){
  return '<option value="">Kies product</option>'+products.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','nl'))
    .map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${safe(p.name)} — $ ${Number(p.price||0).toFixed(2)}</option>`).join('');
}
function addSaleItem(item={productId:'',qty:1,price:''}){
  const row=document.createElement('div'); row.className='sale-item';
  row.innerHTML=`<div class="wide"><label>Product</label><select class="sale-product">${productOptions(item.productId)}</select></div>
  <div><label>Aantal</label><input class="sale-qty" type="number" min="1" value="${Number(item.qty||1)}"></div>
  <div><label>Prijs $</label><input class="sale-price" type="number" min="0" step="0.01" value="${item.price!==''?Number(item.price).toFixed(2):''}"></div>
  <button type="button" class="btn light sale-remove">Verwijder</button>`;
  $('saleItems').appendChild(row);
  const sel=row.querySelector('.sale-product'),qty=row.querySelector('.sale-qty'),price=row.querySelector('.sale-price');
  sel.onchange=()=>{const p=products.find(x=>x.id===sel.value);if(p)price.value=Number(p.price||0).toFixed(2);updateSaleTotal();};
  qty.oninput=updateSaleTotal; price.oninput=updateSaleTotal;
  row.querySelector('.sale-remove').onclick=()=>{row.remove();updateSaleTotal();};
  updateSaleTotal();
}
function getSaleItems(){
  return [...document.querySelectorAll('.sale-item')].map(row=>{
    const productId=row.querySelector('.sale-product').value,p=products.find(x=>x.id===productId);
    return {productId,name:p?.name||'',qty:Number(row.querySelector('.sale-qty').value||0),price:Number(row.querySelector('.sale-price').value||0)};
  }).filter(x=>x.productId&&x.qty>0&&Number.isFinite(x.price));
}
function updateSaleTotal(){$('saleTotal').textContent=getSaleItems().reduce((s,x)=>s+x.qty*x.price,0).toFixed(2);}
function resetSale(){$('saleCustomerName').value='';$('saleCustomerPhone').value='';$('salePaymentStatus').value='paid';$('saleNote').value='';$('saleItems').innerHTML='';addSaleItem();}
async function saveSale(){
  const customerName=$('saleCustomerName').value.trim(),phone=$('saleCustomerPhone').value.trim(),items=getSaleItems();
  if(!customerName)return msg($('saleMessage'),'Vul klantnaam in.',true);
  if(!items.length)return msg($('saleMessage'),'Voeg minstens één product toe.',true);
  for(const item of items){const p=products.find(x=>x.id===item.productId);if(!p||Number(p.quantity||0)<item.qty)return msg($('saleMessage'),`Niet genoeg voorraad voor ${p?.name||'product'}.`,true);}
  const total=items.reduce((s,x)=>s+x.qty*x.price,0);
  try{
    await runTransaction(db,async tx=>{
      for(const item of items){
        const ref=doc(db,'catalogProducts',item.productId),snap=await tx.get(ref);
        if(!snap.exists())throw new Error('Product niet gevonden');
        const current=Number(snap.data().quantity||0);
        if(current<item.qty)throw new Error('Niet genoeg voorraad');
        tx.update(ref,{quantity:current-item.qty,updatedAt:serverTimestamp()});
      }
      const saleRef=doc(collection(db,'sales'));
      tx.set(saleRef,{customerName,customerPhone:phone,paymentStatus:$('salePaymentStatus').value,note:$('saleNote').value.trim(),items,total,createdAt:serverTimestamp()});
    });
    msg($('saleMessage'),'Verkoop opgeslagen en voorraad aangepast.'); resetSale();
  }catch(e){msg($('saleMessage'),'Opslaan mislukt: '+e.message,true);}
}
function renderHistory(){
  const q=$('customerSearch').value.toLowerCase(),status=$('historyStatusFilter').value;
  const list=sales.filter(s=>{const t=`${s.customerName||''} ${s.customerPhone||''}`.toLowerCase();return(!q||t.includes(q))&&(status==='all'||s.paymentStatus===status);})
    .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  $('historyList').innerHTML=list.length?'':'<div class="meta">Nog geen verkopen.</div>';
  for(const s of list){
    const card=document.createElement('div'); card.className='history-card';
    const d=s.createdAt?.toDate?.(),date=d?d.toLocaleString('nl-NL'):'Bezig met opslaan…';
    const items=(s.items||[]).map(i=>`${Number(i.qty||0)} × ${safe(i.name)} — $ ${(Number(i.qty||0)*Number(i.price||0)).toFixed(2)}`).join('<br>');
    card.innerHTML=`<div class="history-head"><div><strong>${safe(s.customerName||'Onbekende klant')}</strong><div class="meta">${safe(s.customerPhone||'Geen telefoon')} · ${date}</div></div><div class="${s.paymentStatus==='paid'?'status-paid':'status-open'}">${s.paymentStatus==='paid'?'Betaald':'Openstaand'}</div></div><div class="meta" style="margin-top:10px">${items}</div><div class="total-box">Totaal: $ ${Number(s.total||0).toFixed(2)}</div>${s.note?`<div class="meta">Opmerking: ${safe(s.note)}</div>`:''}`;
    $('historyList').appendChild(card);
  }
}

function categories(){const old=$('category').value,cs=[...new Set(products.map(p=>p.category||'Overig'))].sort();$('category').innerHTML='<option value="all">Alle categorieën</option>'+cs.map(c=>`<option>${safe(c)}</option>`).join('');if(cs.includes(old))$('category').value=old}
function render(){const q=$('search').value.toLowerCase(),c=$('category').value,a=$('availability').value,ls=products.filter(p=>{const t=`${p.name||''} ${p.barcode||''} ${p.category||''}`.toLowerCase();return(!q||t.includes(q))&&(c==='all'||(p.category||'Overig')===c)&&(a==='all'||(a==='available'?p.available!==false:p.available===false))}).sort((x,y)=>(x.name||'').localeCompare(y.name||'','nl'));$('grid').innerHTML='';for(const p of ls){const e=document.createElement('article');e.className='card';e.innerHTML=`<div class="photo">${p.photoData?`<img src="${p.photoData}">`:'<div class="placeholder">Geen foto</div>'}<span class="badge">${p.available===false?'Uitverkocht':'Beschikbaar'}</span></div><div class="body"><div class="cat">${safe(p.category||'Overig')}</div><h2>${safe(p.name)}</h2><div class="meta">${p.expiryDate?'THT: '+safe(p.expiryDate)+'<br>':''}Aantal: ${Number(p.quantity||0)}</div><div class="price">$ ${Number(p.price||0).toFixed(2)}</div></div>`;$('grid').appendChild(e)}renderList()}
function renderList(){$('list').innerHTML='';for(const p of products){const e=document.createElement('div');e.className='row';e.innerHTML=`${p.photoData?`<img src="${p.photoData}">`:'<div class="placeholder" style="width:80px;height:80px">Geen foto</div>'}<div><strong>${safe(p.name)}</strong><div class="meta">$ ${Number(p.price||0).toFixed(2)}</div></div><div class="actions"><button class="btn light" data-e="${p.id}">Bewerken</button><button class="btn light" data-d="${p.id}">Verwijderen</button></div>`;$('list').appendChild(e)}$('list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));$('list').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Product verwijderen?'))await deleteDoc(doc(db,'catalogProducts',b.dataset.d))})}
function edit(id){const p=products.find(x=>x.id===id);if(!p)return;$('editId').value=id;$('name').value=p.name||'';$('price').value=p.price??'';$('expiry').value=p.expiryDate||'';$('qty').value=p.quantity??1;$('cat').value=p.category||'';$('barcode').value=p.barcode||'';$('notes').value=p.notes||'';$('available').checked=p.available!==false;photoData=p.photoData||'';if(photoData){$('preview').src=photoData;$('preview').classList.remove('hidden')}$('formTitle').textContent='Product aanpassen';$('cancelBtn').classList.remove('hidden');document.querySelector('[data-tab="add"]').click()}
function reset(){$('editId').value='';$('name').value='';$('price').value='';$('expiry').value='';$('qty').value=1;$('cat').value='';$('barcode').value='';$('notes').value='';$('available').checked=true;$('photoInput').value='';$('preview').classList.add('hidden');photoData='';$('formTitle').textContent='Nieuw product';$('cancelBtn').classList.add('hidden');$('foundBox').classList.add('hidden');$('foundBox').textContent='';stopScanner()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab!=='add')stopScanner();document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
$('addSaleItemBtn').onclick=()=>addSaleItem();$('saveSaleBtn').onclick=saveSale;$('customerSearch').oninput=renderHistory;$('historyStatusFilter').onchange=renderHistory;
$('scanBtn').onclick=startScanner;
$('stopScanBtn').onclick=stopScanner;
$('barcode').addEventListener('change',()=>applySavedProduct($('barcode').value.trim()));
$('barcode').addEventListener('blur',()=>applySavedProduct($('barcode').value.trim()));
$('loginBtn').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked')await signInWithRedirect(auth,provider);else msg($('loginMsg'),e.message,true)}};$('logoutBtn').onclick=()=>{stopScanner();signOut(auth)};
$('photoInput').onchange=async()=>{const f=$('photoInput').files?.[0];if(!f)return;photoData=await imageData(f);$('preview').src=photoData;$('preview').classList.remove('hidden')};
$('saveBtn').onclick=async()=>{const name=$('name').value.trim(),price=Number($('price').value);if(!name)return msg($('formMsg'),'Vul productnaam in.',true);if(!Number.isFinite(price))return msg($('formMsg'),'Vul prijs in.',true);const data={name,price,expiryDate:$('expiry').value,quantity:Number($('qty').value||0),category:$('cat').value.trim()||'Overig',barcode:$('barcode').value.trim(),notes:$('notes').value.trim(),available:$('available').checked,photoData,updatedAt:serverTimestamp()};try{if($('editId').value)await setDoc(doc(db,'catalogProducts',$('editId').value),data,{merge:true});else await addDoc(collection(db,'catalogProducts'),{...data,createdAt:serverTimestamp()});msg($('formMsg'),'Product opgeslagen.');reset()}catch(e){msg($('formMsg'),e.message,true)}};
$('cancelBtn').onclick=reset;$('search').oninput=render;$('category').onchange=render;$('availability').onchange=render;getRedirectResult(auth).catch(e=>msg($('loginMsg'),e.message,true));
onAuthStateChanged(auth,u=>{$('loading').classList.add('hidden');if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}if((u.email||'').toLowerCase()!==OWNER){signOut(auth);$('login').classList.remove('hidden');msg($('loginMsg'),'Dit account heeft geen toegang.',true);return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('email').textContent=u.email;onSnapshot(collection(db,'catalogProducts'),s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));categories();render();document.querySelectorAll('.sale-product').forEach(sel=>{const v=sel.value;sel.innerHTML=productOptions(v);});},e=>msg($('formMsg'),e.message,true));onSnapshot(collection(db,'sales'),s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));renderHistory();},e=>msg($('saleMessage'),e.message,true));if(!$('saleItems').children.length)addSaleItem();});
</script>
</body>
