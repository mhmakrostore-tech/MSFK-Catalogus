<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSFK Cache Reset</title>
<style>
body{font-family:Arial,sans-serif;padding:28px;background:#f4f6fa;color:#1f2937}
.box{max-width:600px;margin:auto;background:#fff;padding:24px;border-radius:18px}
h1{margin-top:0}#status{font-weight:700}
</style>
</head>
<body>
<div class="box">
<h1>MSFK herstellen</h1>
<p id="status">Oude offline-cache en service worker verwijderen…</p>
</div>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        try{await reg.unregister();}catch(e){}
      }
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const key of keys){
        try{await caches.delete(key);}catch(e){}
      }
    }
    try{localStorage.removeItem('msfkOfflineCatalogSavedAt');}catch(e){}
    status.textContent='Cache verwijderd. Website wordt opnieuw geopend…';
    setTimeout(()=>location.replace('./?v=270-reset-'+Date.now()),1200);
  }catch(e){
    status.textContent='Reset uitgevoerd. Open daarna index.html opnieuw.';
  }
})();
</script>
</body>
</html>
