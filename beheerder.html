<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c2185b"><title>MSFK Beheerder</title><style>html,body{margin:0;height:100%;font-family:Arial;background:#f4f6fa}#status{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99999;background:#fff;color:#c2185b;font-weight:800;padding:9px 14px;border-radius:999px;box-shadow:0 4px 16px #0003}iframe{border:0;width:100%;height:100%;display:block;background:#fff}</style></head><body><div id="status">Beheerder wordt geopend…</div><iframe id="app" src="./?msfkStart=beheerder"></iframe><script>
const f=document.getElementById("app"),s=document.getElementById("status"),tx=e=>(e?.textContent||"").trim().toLowerCase();
function go(){try{const d=f.contentDocument||f.contentWindow.document;if(!d)return false;const a=[...d.querySelectorAll("button,a,[role=button]")];if(a.some(e=>tx(e).includes("inloggen met google"))){s.textContent="Log in met Google voor Beheerder";return false}const b=a.find(e=>{const t=tx(e);return t==="beheerder"||t==="admin"||t.includes("beheerder")||t.includes("producten beheren")});if(b){b.click();s.style.display="none";return true}}catch(e){}return false}
function watch(){let n=0,x=setInterval(()=>{n++;if(go()||n>240){clearInterval(x);if(n>240)s.style.display="none"}},500)}f.addEventListener("load",watch);watch();
</script></body></html>
